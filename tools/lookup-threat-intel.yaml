annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Query threat feeds for IP, hash, and domain reputation telemetry.
input_schema:
  additionalProperties: false
  properties:
    indicator:
      type: string
    indicator_type:
      type: string
  required:
  - indicator
  - indicator_type
  type: object
name: lookup-threat-intel
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
