annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Parse PCAP flow records and Sysmon logs for beaconing patterns.
input_schema:
  additionalProperties: false
  properties:
    log_snippet:
      type: string
    time_window:
      type: string
  required:
  - log_snippet
  type: object
name: analyze-pcaps-logs
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
